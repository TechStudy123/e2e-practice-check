name: e2e

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          path: test-results/
